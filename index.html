<!DOCTYPE html>

<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Rewind</title>
        <link rel="stylesheet" href="styles.css">
    </head>

    <body>
        <input type="file" id="spotifyle" accept=".json">  <!-- maybe before dashboard but before login? or maybe something in the side nav bar -->

        <header>
            <h1>Rewind</h1>
        </header>

        <nav>
        </nav>

        <aside>
        </aside>

        <div class="top">
            <div class="box">
                <h2>Total Time</h2>
                <p id="ttime">hrs</p>
            </div>

            <div class="box">
                <h2>Total Songs</h2>
                <p id="tsongs"></p>
            </div>

            <div class="box">
                <h2>Total Streams</h2>
                <p id="tstreams"></p>
            </div>

            <div class="box">
                <h2>Total Albums</h2>
                <p id="talbums"></p>
            </div>

            <div class="box">
                <h2>Total Artists</h2>
                <p id="tartists"></p>
            </div>

            <div class="box">
                <h2>Total Genres</h2>
                <p id="tgenres"></p>
            </div>
        </div>
        
        <div class="top">
            <div class="box">
                <h2>Most Listened on</h2>
                <p id="topday">day</p>
            </div>

            <div class="box">
                <h2>Top Song</h2>
                <p id="topsong"></p>
            </div>

            <div class="box">
                <h2>Top Stream</h2>
                <p id="topstream"></p>
            </div>

            <div class="box">
                <h2>Top Album</h2>
                <p id="topalbum"></p>
            </div>

            <div class="box">
                <h2>Top Artist</h2>
                <p id="topartist"></p>
            </div>

            <div class="box">
                <h2>Top Genre</h2>
                <p id="topgenre"></p>
            </div>
        </div>

        <footer>
            built by Riri!
        </footer>

        <script src="script.js"></script>
    </body>
</html>
